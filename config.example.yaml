# Copy to config.yaml. Provider profiles can also be managed from the companion UI.
defaultProfile: example-openai

limits:
  maxPromptLength: 12000
  maxDimension: 4096
  maxResponseBytes: 52428800
  maxConcurrentRequests: 4

diagnostics:
  limit: 150

cache:
  enabled: true
  perUser: true
  directory: ./cache
  ttlSeconds: null

outputs:
  enabled: true
  directory: ./outputs
  includePrompt: false

profiles:
  example-openai:
    type: openai
    url: https://images.example.com/v1/images/generations
    apiKey: ${IMAGE_SCHEMA_API_KEY}
    model: example-image-model
    timeoutMs: 180000
    defaults:
      width: 1024
      height: 1024
      quality: auto
      outputFormat: png

  # Optional ComfyUI example. Import the executable API workflow in the UI.
  # example-comfyui:
  #   type: comfyui
  #   url: http://comfyui.example.internal:8188
  #   workflow: { }
  #   bindings: { }
  #   timeoutMs: 300000
